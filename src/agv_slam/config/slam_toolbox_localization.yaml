slam_toolbox:
  ros__parameters:
    # [FIX 1] BAT BUOC phai khai bao use_sim_time: false de dong bo toan he thong
    use_sim_time: false

    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: Base_footprint

    scan_topic: /scan_filtered

    mode: localization
    # Launch overrides this with map_file_name:=<serialized posegraph basename>.
    # A normal occupancy-grid .yaml/.pgm is not sufficient for localization mode.
    map_file_name: /home/hcmute/agv_mpc/maps/lidar_2d/graphs/current_20260616_185758
    map_start_at_dock: true

    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # [FIX 2] Giam tan so publish TF xuong 20 Hz
    # Ep Orin Nano publish 50 Hz (0.02) trong khi Scan Matcher chua tinh xong
    # se gay ra hien tuong TF co timestamp cu.
    transform_publish_period: 0.05

    # [FIX 3] Dat lai throttle_scans = 1
    # Neu de 3, he thong bo qua 2/3 luong scan,
    # dan den viec update pose qua thua, lam sai so ngoai suy tang len.
    # Jetson Orin Nano du suc ganh throttle_scans: 1 cho LiDAR 2D.
    throttle_scans: 1
    # Valid slam_toolbox 2.6.x parameter. Keep enough scans while TF catches up
    # during short CPU spikes instead of dropping at the default queue depth.
    scan_queue_size: 50

    stack_size_to_use: 40000000
    enable_interactive_mode: false

    resolution: 0.05
    map_update_interval: 8.0
    minimum_time_interval: 0.1
    max_laser_range: 10.0

    minimum_range: 0.15
    maximum_range: 12.0
    minimum_laser_range: 0.15
    maximum_laser_range: 12.0

    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.087

    # [FIX 4] Giam buffer size
    # Khi chay Localization, khong can giu qua nhieu lich su scan,
    # viec nay chi lam nang CPU va cham qua trinh xuat TF.
    scan_buffer_size: 5
    scan_buffer_maximum_scan_distance: 10.0

    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    distance_decomposition_radius: 3.5
    distance_penalty_gain: 0.0

    # Mission navigation uses a fixed serialized posegraph. Loop closure/refine
    # belongs in a separate offline/refine session, not while Nav2 is driving.
    do_loop_closing: false
    loop_search_maximum_distance: 3.0
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    debug_logging: false
